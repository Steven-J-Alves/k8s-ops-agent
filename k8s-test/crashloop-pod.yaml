apiVersion: v1
kind: Namespace
metadata:
  name: production
---
# Pod that enters CrashLoopBackOff immediately (exits with code 1)
apiVersion: v1
kind: Pod
metadata:
  name: api-server-crashloop
  namespace: production
  labels:
    app: api-server
    test: crashloop
spec:
  containers:
  - name: api
    image: busybox:1.36
    command: ["sh", "-c", "echo 'starting...'; sleep 2; echo 'fatal: database connection refused'; exit 1"]
  restartPolicy: Always
---
# Pod that gets OOMKilled (memory limit too low, writes until killed)
apiVersion: v1
kind: Pod
metadata:
  name: worker-oomkilled
  namespace: production
  labels:
    app: worker
    test: oom
spec:
  containers:
  - name: worker
    image: busybox:1.36
    command: ["sh", "-c", "echo 'allocating memory...'; dd if=/dev/zero of=/dev/null bs=1M count=200 & sleep 60"]
    resources:
      limits:
        memory: "4Mi"
      requests:
        memory: "2Mi"
  restartPolicy: Always
---
# Pod that fails to start (bad image — ImagePullBackOff → BackOff events)
apiVersion: v1
kind: Pod
metadata:
  name: frontend-bad-image
  namespace: production
  labels:
    app: frontend
    test: bad-image
spec:
  containers:
  - name: frontend
    image: nonexistent-registry.local/frontend:v999
  restartPolicy: Always
